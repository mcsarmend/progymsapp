buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Elimina classpath de aquí si usas plugins en settings.gradle
        // classpath 'com.android.tools.build:gradle:8.11.2'  // <-- Comenta o elimina esto
        // classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"  // <-- Comenta o elimina esto
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}